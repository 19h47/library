name: End to end

on: pull_request

# One run per pull request: a push cancels the one still running for the push before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    # Ubuntu 24.04 rather than ubuntu-latest, Ubuntu 26.04 since October 2026: apt could not resolve its mirrors there,
    # and Playwright installs the dependencies of its browsers for the systems it knows.
    runs-on: ubuntu-24.04
    # A step that hangs, such as the install of a browser, fails rather than running for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The version of package.json, its packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      # The dependencies of Composer, which load the classes of the plugin, as its package has them.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - uses: ramsey/composer-install@v3
        with:
          composer-options: --no-dev

      # The latest WordPress with the plugin, on PHP 8.4, one environment, at localhost:8889.
      - run: pnpm exec wp-env start

      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

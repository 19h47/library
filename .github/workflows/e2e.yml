name: End to end

on: pull_request

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    # A step that hangs, such as the install of a browser, fails rather than running for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The version of package.json, its packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium webkit

      # The dependencies of Composer, which load the classes of the plugin, as its package has them.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - run: composer install --no-dev --no-progress --no-interaction

      # The latest WordPress with the plugin, on PHP 8.4: the tests run on its environment of tests, at localhost:8889.
      - run: pnpm exec wp-env start

      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

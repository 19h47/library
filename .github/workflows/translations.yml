name: Translations

on: pull_request

# One run per pull request: a push cancels the one still running for the push before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-translations:
    # Ubuntu 24.04 rather than ubuntu-latest, Ubuntu 26.04 since October 2026: apt could not resolve its mirrors there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      # WP-CLI among the dependencies of composer.lock, the one the files are written with, from the cache of Composer.
      - uses: ramsey/composer-install@v3

      - run: sudo apt-get install -y gettext

      - run: sh bin/update-translations.sh

      - run: |
          git status --short
          git diff
          test -z "$(git status --porcelain)"

name: Translations

on: pull_request

permissions:
  contents: read

jobs:
  update-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The WP-CLI that wrote the files, which names itself in them.
      - id: wp-cli
        run: |
          echo "version=$(sed -n 's/^"X-Generator: WP-CLI \(.*\)\\n"$/\1/p' languages/library.pot)" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Its release, else the latest one from the builds of WP-CLI, which must be the same: the downloads of the releases
      # of GitHub may fail, as setup-php did.
      - env:
          VERSION: ${{ steps.wp-cli.outputs.version }}
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/wp" "https://github.com/wp-cli/wp-cli/releases/download/v$VERSION/wp-cli-$VERSION.phar" \
            || curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli-release.phar
          sudo install "$RUNNER_TEMP/wp" /usr/local/bin/wp
          test "$(wp --version)" = "WP-CLI $VERSION"

      - run: sudo apt-get install -y gettext

      - run: sh bin/update-translations.sh

      - run: |
          git status --short
          git diff
          test -z "$(git status --porcelain)"

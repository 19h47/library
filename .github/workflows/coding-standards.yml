name: Coding standards

on: pull_request

permissions:
  contents: read

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - run: composer install --no-progress --no-interaction

      - run: vendor/bin/phpcs
